<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi District</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            /* <-- Добавлено: выстраивает кнопки в столбик */
            justify-content: center;
            align-items: center;
            gap: 20px;
            /* <-- Добавлено: расстояние между кнопками */
            background: #f3f5f8;
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            text-decoration: none;
            background: #19b65b;
            color: #fff;
            padding: 18px 35px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            min-width: 250px;
            /* Чтобы кнопки были одинаковой ширины */
            transition: background 0.2s;
        }

        a:hover {
            background: #15a04f;
        }
    </style>
</head>

<body>

    <a href="clients/client.html">
        Пасажир
    </a>

    <a href="driver.html">
        Водитель
    </a>

</body>

</html>
