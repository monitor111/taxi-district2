<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Деталі замовлення</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="order-page">

    <div class="header-card">
        <h2 id="order-id">Замовлення #...</h2>
        <span class="status-new" id="order-status">Новий</span>
    </div>

    <div class="card">
        <div class="title">Звідки</div>
        <div class="district" id="from-sector">...</div>
        <div class="address" id="from-address">...</div>
    </div>

    <div class="card">
        <div class="title">Куди</div>
        <div class="district" id="to-sector">...</div>
        <div class="address" id="to-address">...</div>
    </div>

    <div class="card">
        <div class="row">
            <span>Ціна</span>
            <strong class="price-big" id="order-price">... грн</strong>
        </div>
        <div class="row">
            <span>Комісію оплачує</span>
            <strong id="commission-payer">Клієнт</strong>
        </div>
        <div class="row">
            <span>Відстань</span>
            <strong id="order-distance">... км</strong>
        </div>
        
        <!-- НОВЫЙ БЛОК: Телефон клиента (скрыт по умолчанию) -->
        <div class="row hidden" id="client-phone-row" style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc;">
            <span>Телефон клієнта:</span>
            <strong id="client-phone" style="font-size: 18px; color: #19b65b;">...</strong>
        </div>
    </div>

    <a class="map-btn" id="map-link" href="#" target="_blank">
        🗺 Відкрити маршрут в Google Maps / Waze
    </a>

    <!-- Блок кнопок для НОВОГО заказа -->
    <div class="buttons" id="decision-buttons">
        <button class="take-btn" id="take-btn">Беру замовлення</button>
        <button class="price-btn">Нова ціна</button>
        <button class="cancel-btn">Відмова</button>
    </div>

    <!-- Блок кнопок для ПРИНЯТОГО заказа (скрыт по умолчанию) -->
    <div class="buttons hidden" id="action-buttons" style="flex-direction: column; gap: 10px;">
        <a id="call-client-btn" href="#" class="take-btn" style="text-align: center; text-decoration: none; display: block; background: #19b65b;">
            📞 Зателефонувати клієнту
        </a>
        <button class="price-btn" style="background: #3498db; color: white;">
            🚗 Поїздка розпочата
        </button>
    </div>

</div>

   <script src="js/reception.js"></script>
</body>
</html>
