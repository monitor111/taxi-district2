<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Заказ</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="order-page">

    <div class="header-card">

        <h2>Заказ №2541</h2>

        <span class="status-new">Новый</span>

    </div>

    <div class="card">

        <div class="title">
            Откуда
        </div>

        <div class="district">
            Парус 1
        </div>

        <div class="address">
            ул. Метростроевская, 5 • подъезд 7
        </div>

    </div>

    <div class="card">

        <div class="title">
            Куда
        </div>

        <div class="district">
            ЦУМ
        </div>

        <div class="address">
            пр. Дмитрия Яворницкого, 50
        </div>

    </div>

    <div class="card">

        <div class="row">

            <span>Цена</span>

            <strong class="price-big">
                300 грн
            </strong>

        </div>

        <div class="row">

            <span>Комиссию оплачивает</span>

            <strong>
                Клиент
            </strong>

        </div>

        <div class="row">

            <span>Расстояние</span>

            <strong>
                11.4 км
            </strong>

        </div>

        <div class="row">

            <span>Стоимость / км</span>

            <strong>
                26.3 грн
            </strong>

        </div>

    </div>

    <a class="map-btn" href="#">

        Открыть в Google Maps / Waze

    </a>

    <div class="buttons">

        <button class="take-btn">

            Беру заказ

        </button>

        <button class="price-btn">

            Новая цена

        </button>

        <button class="cancel-btn">

            Отказ

        </button>

    </div>

</div>

<script src="js/script.js"></script>

</body>

</html>
