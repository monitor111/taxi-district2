<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Orders</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="top-bar">

        <div>
            <h1>Свободные заказы</h1>
            <p>Сегодня</p>
        </div>

        <button class="status-btn">
            Свободен
        </button>

    </header>

    <main class="orders">

        <div class="order-card">

            <div class="route">
                <strong>Парус 1</strong>
                <span>→</span>
                <strong>ЦУМ</strong>
            </div>

            <div class="info">

                <span>12:30</span>

                <span class="price">300 грн</span>

            </div>

        </div>

        <div class="order-card">

            <div class="route">
                <strong>Коммунар</strong>
                <span>→</span>
                <strong>Вокзал</strong>
            </div>

            <div class="info">

                <span>13:10</span>

                <span class="price">260 грн</span>

            </div>

        </div>

        <div class="order-card">

            <div class="route">
                <strong>Красный Камень</strong>
                <span>→</span>
                <strong>Мост Сити</strong>
            </div>

            <div class="info">

                <span>14:00</span>

                <span class="price">340 грн</span>

            </div>

        </div>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
