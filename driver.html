<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Orders</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="top-bar">

        <div>
            <h1>Вільні замовлення</h1>
            <p>Сьогодні</p>
        </div>

        <button class="status-btn">
            Свободен
        </button>

    </header>

        <main class="orders">
        <!-- Сюда JavaScript будет добавлять реальные заказы -->
    </main>

    <!-- Модальное окно регистрации (имя + телефон) -->
    <div id="registrationModal" class="modal hidden">
        <div class="modal-content">
            <h2>Реєстрація водія</h2>
            <p>Щоб приймати замовлення, вкажіть ваше ім'я та телефон</p>
            
            <div class="input-wrapper">
                <label>Ваше ім'я</label>
                <input type="text" id="driverName" placeholder="Олександр">
            </div>
            
            <div class="input-wrapper">
                <label>Телефон</label>
                <input type="tel" id="driverPhone" placeholder="+380 XX XXX XX XX">
            </div>
            
            <button id="saveDriverBtn" class="calc-btn">Зберегти</button>
        </div>
    </div>

    <!-- Модальное окно регистрации (машина) -->
    <div id="carModal" class="modal hidden">
        <div class="modal-content">
            <h2>Дані авто</h2>
            <p>Вкажіть дані вашого автомобіля</p>
            
            <div class="input-wrapper">
                <label>Марка авто</label>
                <input type="text" id="carMake" placeholder="Toyota Camry">
            </div>
            
            <div class="input-wrapper">
                <label>Номер авто</label>
                <input type="text" id="carNumber" placeholder="АА 1234 ВВ">
            </div>
            
            <div class="input-wrapper">
                <label>Рік випуску</label>
                <input type="text" id="carYear" placeholder="2018">
            </div>
            
            <button id="saveCarBtn" class="calc-btn">Зберегти</button>
        </div>
    </div>

       <script src="js/driver.js"></script>

</body>

</html>
